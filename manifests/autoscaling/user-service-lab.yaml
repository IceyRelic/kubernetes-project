# 发布示例：源自实验最终对象并做去敏/参数化；修改示例地址与镜像、准备合法工件后审阅应用。
# 这些发布模板未重新部署；本仓库保留原实验的已验证事实与转换边界。
apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscaler
metadata:
  labels:
    codex-stage: hpa-20261006
    project: k8s-java-lab
  name: user-service-lab
  namespace: spring-cloud
spec:
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 60
        type: Pods
        value: 1
      selectPolicy: Max
      stabilizationWindowSeconds: 60
    scaleUp:
      policies:
      - periodSeconds: 60
        type: Pods
        value: 1
      selectPolicy: Max
      stabilizationWindowSeconds: 0
  maxReplicas: 3
  metrics:
  - resource:
      name: cpu
      target:
        averageUtilization: 20
        type: Utilization
    type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
